[workspace]
resolver = "3"
members = ["crates/ferry-core", "crates/ferry-cli", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1"
iroh = "1.3"
iroh-blobs = "0.103.1"
irpc = "0.17"
n0-future = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
hex = "0.4"
futures-buffered = "0.2"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
