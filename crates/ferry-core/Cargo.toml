[package]
name = "ferry-core"
description = "Ferry engine: share files peer-to-peer over iroh"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
blake3 = "1"
data-encoding = "2"
getrandom = "0.3"
# The local networks of this device, for "Hide my IP address" (both already used by iroh).
ipnet = "2"
netwatch = "0.19"
postcard = { version = "1", default-features = false, features = ["use-std"] }
# The same HTTP client and TLS settings iroh uses for its own HTTPS requests.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false }
iroh.workspace = true
iroh-blobs.workspace = true
irpc.workspace = true
n0-future.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
walkdir.workspace = true
hex.workspace = true
futures-buffered.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
# Private files (secret keys, the registry) get an access list for the current user only.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
tracing-subscriber.workspace = true
# A plain-HTTP relay for tests of relay-only connections.
iroh-relay = { version = "1.4", features = ["server"] }
