name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag whose draft release to build and publish. Leave empty to run Release Please.
        type: string
        required: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.repository == 'Alexxfromgit/Ferry' && github.ref == 'refs/heads/main' && !inputs.tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.release.outputs.tag_name }}
    env:
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
    steps:
      - name: Check release configuration
        if: env.HAS_RELEASE_TOKEN == 'false'
        run: echo "::notice::Set the repository's RELEASE_TOKEN Actions secret to enable Release Please."
      - id: release
        if: env.HAS_RELEASE_TOKEN == 'true'
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  prepare:
    needs: release-please
    if: >-
      ${{ !cancelled() && github.repository == 'Alexxfromgit/Ferry' &&
          (needs.release-please.outputs.tag != '' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Draft releases are visible to callers with write access.
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a vX.Y.Z tag."
            exit 1
          fi
          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]]; then
            echo "::error::Create a draft release for $TAG before building its assets."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    # Release Please is skipped on manual retries, and GitHub skips every job after a
    # skipped one unless the job sets its own condition.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  build:
    name: Installers (${{ matrix.platform }})
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, os: windows-latest, extensions: 'msi,exe', updater_extensions: 'msi,exe' }
          - { platform: macos-arm64, os: macos-15, extensions: 'dmg,pkg,app.tar.gz', updater_extensions: app.tar.gz }
          - { platform: macos-x64, os: macos-15-intel, extensions: 'dmg,pkg,app.tar.gz', updater_extensions: app.tar.gz }
          - { platform: linux-x64, os: ubuntu-22.04, extensions: 'deb,AppImage', updater_extensions: AppImage }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ needs.prepare.outputs.tag }}
      EXTENSIONS: ${{ matrix.extensions }}
      UPDATER_EXTENSIONS: ${{ matrix.updater_extensions }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Check release versions
        shell: pwsh
        run: |
          $expected = $env:TAG.Substring(1)
          $workspace = cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json
          $package = Get-Content app/package.json -Raw | ConvertFrom-Json
          $lock = Get-Content app/package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $desktop = Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $manifest = Get-Content .release-please-manifest.json -Raw | ConvertFrom-Json -AsHashtable
          $versions = @($workspace.packages.version) + @(
            $package.version, $lock.version, $lock.packages[''].version, $desktop.version, $manifest['.']
          )
          if ($versions | Where-Object { $_ -cne $expected }) {
            throw "All Ferry package versions must match $env:TAG."
          }
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev pkg-config patchelf libxdo-dev libfuse2 file xdg-utils
      - name: Build installers
        shell: pwsh
        env:
          FERRY_UPDATER_PUBLIC_KEY: ${{ vars.FERRY_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (!$env:FERRY_UPDATER_PUBLIC_KEY -or !$env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Configure FERRY_UPDATER_PUBLIC_KEY and TAURI_SIGNING_PRIVATE_KEY before publishing. See docs/RELEASING.md.'
          }
          if ($IsWindows) {
            ./build.ps1 -Bundle
          } else {
            bash ./build.sh --bundle
          }
      - name: Stage installers
        shell: pwsh
        run: |
          $version = $env:TAG.Substring(1)
          New-Item -ItemType Directory -Path release-assets | Out-Null
          foreach ($ext in $env:EXTENSIONS.Split(',')) {
            $files = @(Get-ChildItem target/release/bundle -Recurse -File -Filter "*.$ext")
            if ($files.Count -ne 1) {
              throw "Expected one .$ext installer for $env:PLATFORM, found $($files.Count)."
            }
            $source = $files[0].FullName
            $destination = "release-assets/Ferry-$version-$env:PLATFORM.$ext"
            Copy-Item -LiteralPath $source -Destination $destination
            if ($ext -cin $env:UPDATER_EXTENSIONS.Split(',')) {
              Copy-Item -LiteralPath "$source.sig" -Destination "$destination.sig"
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  publish:
    needs: [prepare, verify, build]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          needs.verify.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      FERRY_UPDATER_PUBLIC_KEY: ${{ vars.FERRY_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Validate assets and write checksums
        run: python3 scripts/prepare-release-assets.py assets "$TAG" "$GITHUB_REPOSITORY"
      - uses: actions/attest@v4
        with:
          subject-path: assets/*
      - name: Upload and publish draft
        working-directory: assets
        run: |
          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]]; then
            echo "::error::$TAG is no longer a draft."
            exit 1
          fi
          gh release upload "$TAG" ./* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  # Android starts once the Direct signing certificate is configured; see docs/RELEASING.md.
  # Both channels are built from the tag: the Direct APK (ferry/android on R2, with its update
  # feed) and the Play bundle (the internal testing track). Neither goes on the GitHub release.
  build-android:
    name: Android
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && vars.FERRY_DIRECT_CERT_SHA256 != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: android-release
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci
      - name: Write the signing keys
        env:
          DIRECT_KEYSTORE: ${{ secrets.ANDROID_DIRECT_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [[ -z "$DIRECT_KEYSTORE" || -z "$UPLOAD_KEYSTORE" ]]; then
            echo "::error::Set ANDROID_DIRECT_KEYSTORE_B64 and ANDROID_UPLOAD_KEYSTORE_B64 in the android-release environment. See docs/RELEASING.md."
            exit 1
          fi
          base64 --decode <<<"$DIRECT_KEYSTORE" > "$RUNNER_TEMP/direct.p12"
          base64 --decode <<<"$UPLOAD_KEYSTORE" > "$RUNNER_TEMP/upload.p12"
      - name: Build the Direct APK
        env:
          ORG_GRADLE_PROJECT_ferryDist: direct
          ANDROID_DIRECT_KEYSTORE: ${{ runner.temp }}/direct.p12
          ANDROID_DIRECT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DIRECT_KEYSTORE_PASSWORD }}
          ANDROID_DIRECT_KEY_ALIAS: ${{ vars.ANDROID_DIRECT_KEY_ALIAS || 'ferry-direct' }}
          ANDROID_DIRECT_KEY_PASSWORD: ${{ secrets.ANDROID_DIRECT_KEYSTORE_PASSWORD }}
          FERRY_DIRECT_CERT_SHA256: ${{ vars.FERRY_DIRECT_CERT_SHA256 }}
        run: |
          set -euo pipefail
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm --prefix app run tauri android build -- --apk --target aarch64 armv7
          apk="android-direct/Ferry-${TAG#v}-android.apk"
          mkdir -p android-direct
          mv app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$apk"
          node scripts/android-release.mjs verify "$apk" --tag "$TAG" --cert "$FERRY_DIRECT_CERT_SHA256"
      - name: Build the Play bundle
        env:
          ORG_GRADLE_PROJECT_ferryDist: play
          ANDROID_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.p12
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS || 'upload' }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm --prefix app run tauri android build -- --aab --target aarch64 armv7 x86_64
          outputs=app/src-tauri/gen/android/app/build/outputs
          aab="android-play/Ferry-${TAG#v}-play.aab"
          mkdir -p android-play
          mv "$outputs/bundle/universalRelease/app-universal-release.aab" "$aab"
          mv "$outputs/mapping/universalRelease/mapping.txt" android-play/mapping.txt
          if ! keytool -printcert -jarfile "$aab" | grep -q 'SHA256:'; then
            echo "::error::The Play bundle is not signed."
            exit 1
          fi
      - name: Remove the signing keys
        if: always()
        run: rm -f "$RUNNER_TEMP/direct.p12" "$RUNNER_TEMP/upload.p12"
      - uses: actions/upload-artifact@v7
        with:
          name: android-direct
          path: android-direct/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
      - uses: actions/upload-artifact@v7
        with:
          name: android-play
          path: android-play/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # The APK goes up first and has to download intact from the public host before latest.json,
  # which installed Direct apps read, points at it.
  publish-android-direct:
    name: Publish Android (Direct)
    needs: [prepare, build-android, publish]
    if: ${{ !cancelled() && needs.build-android.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: android-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      BUCKET: ${{ vars.R2_BUCKET }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 rejects some of the checksum headers newer AWS CLIs send by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      FERRY_DIRECT_CERT_SHA256: ${{ vars.FERRY_DIRECT_CERT_SHA256 }}
    steps:
      - name: Check the R2 configuration
        run: |
          if [[ -z "$BUCKET" || -z "$R2_ACCOUNT_ID" || -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::error::Set the R2_BUCKET and R2_ACCOUNT_ID variables and the R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY secrets. See docs/RELEASING.md."
            exit 1
          fi
          echo "AWS_ENDPOINT_URL=https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8
        with:
          name: android-direct
          path: android-direct
      - name: Prepare the update feed
        id: feed
        run: |
          set -euo pipefail
          live="$RUNNER_TEMP/live.json"
          errors="$RUNNER_TEMP/get-feed.log"
          if ! aws s3api get-object --bucket "$BUCKET" --key ferry/android/latest.json "$live" >/dev/null 2>"$errors"; then
            # The first release has no feed yet; any other error stops the run.
            if ! grep -q NoSuchKey "$errors"; then
              cat "$errors"
              exit 1
            fi
            rm -f "$live"
          fi
          node scripts/android-release.mjs prepare android-direct/*.apk --tag "$TAG" \
            --cert "$FERRY_DIRECT_CERT_SHA256" --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/r2" --current "$live"
      - uses: actions/attest@v4
        if: steps.feed.outputs.publish == 'true'
        with:
          subject-path: ${{ steps.feed.outputs.apk_path }}
      - name: Upload the APK, then the feed
        if: steps.feed.outputs.publish == 'true'
        env:
          APK_KEY: ${{ steps.feed.outputs.apk_key }}
          APK_PATH: ${{ steps.feed.outputs.apk_path }}
          FEED_PATH: ${{ steps.feed.outputs.feed_path }}
          SHA256: ${{ steps.feed.outputs.sha256 }}
        run: |
          set -euo pipefail
          aws s3 cp "$APK_PATH" "s3://$BUCKET/$APK_KEY" --only-show-errors \
            --content-type application/vnd.android.package-archive \
            --cache-control "public, max-age=31536000, immutable" --metadata "sha256=$SHA256"
          url="https://downloads.xenvaultinteractive.com/$APK_KEY"
          public=$(curl -fsSL --retry 3 "$url" | sha256sum | cut -d' ' -f1)
          if [[ "$public" != "$SHA256" ]]; then
            echo "::error::$url does not serve the uploaded APK, so the feed was left as it was."
            exit 1
          fi
          aws s3 cp "$FEED_PATH" "s3://$BUCKET/ferry/android/latest.json" --only-show-errors \
            --content-type application/json --cache-control no-cache

  publish-play:
    name: Publish Android (Google Play)
    needs: [prepare, build-android, publish]
    if: ${{ !cancelled() && needs.build-android.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: android-release
    permissions:
      contents: read
    env:
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Check the Play configuration
        if: env.HAS_PLAY_ACCOUNT == 'false'
        run: echo "::notice::Set PLAY_SERVICE_ACCOUNT_JSON to upload to Google Play. The bundle is in the android-play artifact for a manual upload."
      - uses: actions/download-artifact@v8
        if: env.HAS_PLAY_ACCOUNT == 'true'
        with:
          name: android-play
          path: android-play
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        if: env.HAS_PLAY_ACCOUNT == 'true'
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.xenvaultinteractive.ferry
          releaseFiles: android-play/*.aab
          releaseName: ${{ needs.prepare.outputs.tag }}
          track: internal
          # Google Play only takes draft releases until the app's first review has passed.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          mappingFile: android-play/mapping.txt
