name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag whose draft release to build and publish. Leave empty to run Release Please.
        type: string
        required: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.repository == 'Alexxfromgit/Ferry' && github.ref == 'refs/heads/main' && !inputs.tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.release.outputs.tag_name }}
    env:
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
    steps:
      - name: Check release configuration
        if: env.HAS_RELEASE_TOKEN == 'false'
        run: echo "::notice::Set the repository's RELEASE_TOKEN Actions secret to enable Release Please."
      - id: release
        if: env.HAS_RELEASE_TOKEN == 'true'
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  prepare:
    needs: release-please
    if: >-
      ${{ !cancelled() && github.repository == 'Alexxfromgit/Ferry' &&
          (needs.release-please.outputs.tag != '' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Draft releases are visible to callers with write access.
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a vX.Y.Z tag."
            exit 1
          fi
          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]]; then
            echo "::error::Create a draft release for $TAG before building its assets."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    # Release Please is skipped on manual retries, and GitHub skips every job after a
    # skipped one unless the job sets its own condition.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  build:
    name: Installers (${{ matrix.platform }})
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, os: windows-latest, extensions: 'msi,exe', updater_extensions: 'msi,exe' }
          - { platform: macos-arm64, os: macos-15, extensions: 'dmg,pkg,app.tar.gz', updater_extensions: app.tar.gz }
          - { platform: macos-x64, os: macos-15-intel, extensions: 'dmg,pkg,app.tar.gz', updater_extensions: app.tar.gz }
          - { platform: linux-x64, os: ubuntu-22.04, extensions: 'deb,AppImage', updater_extensions: AppImage }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ needs.prepare.outputs.tag }}
      EXTENSIONS: ${{ matrix.extensions }}
      UPDATER_EXTENSIONS: ${{ matrix.updater_extensions }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Check release versions
        shell: pwsh
        run: |
          $expected = $env:TAG.Substring(1)
          $workspace = cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json
          $package = Get-Content app/package.json -Raw | ConvertFrom-Json
          $lock = Get-Content app/package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $desktop = Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $manifest = Get-Content .release-please-manifest.json -Raw | ConvertFrom-Json -AsHashtable
          $versions = @($workspace.packages.version) + @(
            $package.version, $lock.version, $lock.packages[''].version, $desktop.version, $manifest['.']
          )
          if ($versions | Where-Object { $_ -cne $expected }) {
            throw "All Ferry package versions must match $env:TAG."
          }
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev pkg-config patchelf libxdo-dev libfuse2 file xdg-utils
      - name: Build installers
        shell: pwsh
        env:
          FERRY_UPDATER_PUBLIC_KEY: ${{ vars.FERRY_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (!$env:FERRY_UPDATER_PUBLIC_KEY -or !$env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Configure FERRY_UPDATER_PUBLIC_KEY and TAURI_SIGNING_PRIVATE_KEY before publishing. See docs/RELEASING.md.'
          }
          if ($IsWindows) {
            ./build.ps1 -Bundle
          } else {
            bash ./build.sh --bundle
          }
      - name: Stage installers
        shell: pwsh
        run: |
          $version = $env:TAG.Substring(1)
          New-Item -ItemType Directory -Path release-assets | Out-Null
          foreach ($ext in $env:EXTENSIONS.Split(',')) {
            $files = @(Get-ChildItem target/release/bundle -Recurse -File -Filter "*.$ext")
            if ($files.Count -ne 1) {
              throw "Expected one .$ext installer for $env:PLATFORM, found $($files.Count)."
            }
            $source = $files[0].FullName
            $destination = "release-assets/Ferry-$version-$env:PLATFORM.$ext"
            Copy-Item -LiteralPath $source -Destination $destination
            if ($ext -cin $env:UPDATER_EXTENSIONS.Split(',')) {
              Copy-Item -LiteralPath "$source.sig" -Destination "$destination.sig"
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  publish:
    needs: [prepare, verify, build]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          needs.verify.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      FERRY_UPDATER_PUBLIC_KEY: ${{ vars.FERRY_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Validate assets and write checksums
        run: python3 scripts/prepare-release-assets.py assets "$TAG" "$GITHUB_REPOSITORY"
      - uses: actions/attest@v4
        with:
          subject-path: assets/*
      - name: Upload and publish draft
        working-directory: assets
        run: |
          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]]; then
            echo "::error::$TAG is no longer a draft."
            exit 1
          fi
          gh release upload "$TAG" ./* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
