name: Bug report
description: Report a problem with Ferry
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use sample files and redact tickets, device IDs, IP addresses, and personal file paths before posting.
  - type: input
    id: version
    attributes:
      label: Ferry version or commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      description: For transfer problems, include both devices and whether Ferry showed Direct or Via relay.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and what happened
      description: Include what you expected and the exact error if you saw one.
    validations:
      required: true
